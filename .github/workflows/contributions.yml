name: Generate contribution animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # Generar snake
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generar pacman real
      - name: Generate pacman animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        continue-on-error: true

      - name: Move pacman files to dist
        run: |
          test -f pacman-contribution-graph.svg && mv pacman-contribution-graph.svg dist/pacman.svg || echo "pacman.svg no generado"
          test -f pacman-contribution-graph-dark.svg && mv pacman-contribution-graph-dark.svg dist/pacman-dark.svg || echo "pacman-dark.svg no generado"

      - name: List all generated files
        run: |
          echo "=== All files in dist ==="
          ls -la dist/

      # Publicar en branch output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}