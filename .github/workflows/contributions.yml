name: Generate contribution animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Generar snake
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: rename snake files
        run: |
          ls -la dist/ || true
          test -f dist/github-contribution-grid-snake.svg && mv dist/github-contribution-grid-snake.svg dist/snake.svg || echo "snake.svg no generado"
          test -f dist/github-contribution-grid-snake-dark.svg && mv dist/github-contribution-grid-snake-dark.svg dist/snake-dark.svg || echo "snake-dark.svg no generado"
          ls -la dist/

      # Generar pacman
      - name: generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: move pacman files to dist
        run: |
          mkdir -p dist
          test -f pacman-contribution-graph.svg && mv pacman-contribution-graph.svg dist/pacman.svg || echo "pacman.svg no generado"
          test -f pacman-contribution-graph-dark.svg && mv pacman-contribution-graph-dark.svg dist/pacman-dark.svg || echo "pacman-dark.svg no generado"
          ls -la dist/

      # Publicar en branch output
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
