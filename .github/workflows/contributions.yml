name: Generate contribution animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate-snake

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate pacman animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Move pacman files
        run: |
          ls -la
          if [ -f "pacman-contribution-graph.svg" ]; then
            mv pacman-contribution-graph.svg pacman.svg
            echo "✓ pacman.svg generado"
          fi
          if [ -f "pacman-contribution-graph-dark.svg" ]; then
            mv pacman-contribution-graph-dark.svg pacman-dark.svg
            echo "✓ pacman-dark.svg generado"
          fi
          ls -la

      - name: Commit pacman files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman.svg pacman-dark.svg 2>/dev/null || true
          git commit -m "Update pacman animation" || echo "No changes to commit"
          git push || echo "Nothing to push"