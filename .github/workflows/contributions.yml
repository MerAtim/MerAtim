name: Generate contribution animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # Generar snake
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify snake files
        run: |
          echo "=== Snake files ==="
          ls -la dist/

      # Generar pacman
      - name: Generate pacman animation
        uses: Platane/snk@v3
        id: pacman
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman.svg?color_dots=#fb8c00,#ffb74d,#ffe0b2,#fff8e1,#ffffff&color_snake=#fb8c00
            dist/pacman-dark.svg?palette=github-dark&color_dots=#fb8c00,#ffb74d,#ffe0b2,#fff8e1,#1a1b27&color_snake=#fb8c00
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Alternativa: usar el action de pacman si prefieres el estilo original
      # - name: Generate pacman (alternative)
      #   uses: abozanona/pacman-contribution-graph@main
      #   with:
      #     github_user_name: ${{ github.repository_owner }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     NODE_OPTIONS: --max-old-space-size=8192
      #   continue-on-error: true
      #
      # - name: Move pacman files
      #   run: |
      #     test -f pacman-contribution-graph.svg && mv pacman-contribution-graph.svg dist/pacman.svg || true
      #     test -f pacman-contribution-graph-dark.svg && mv pacman-contribution-graph-dark.svg dist/pacman-dark.svg || true

      - name: List all generated files
        run: |
          echo "=== All files in dist ==="
          ls -la dist/

      # Publicar en branch output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
